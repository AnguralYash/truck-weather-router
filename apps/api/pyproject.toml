[project]
name = "truck-weather-router-api"
version = "0.1.0"
description = "Weather-aware truck routing API"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6",
    "httpx>=0.28.1,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.18.0,<2",
    "pytest>=8.4.0,<9",
    "pytest-django>=4.11.0,<5",
    "ruff>=0.14.0,<1",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
